<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบประมูลทอดตลาดทรัพย์สิน</title>
 
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
 
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
 
  <!-- Babel สำหรับ JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
 
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="bg-gray-50 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Lucide Icons Component
    const Gavel = (props) => <i data-lucide="gavel" {...props} />;
    const Users = (props) => <i data-lucide="users" {...props} />;
    const Clock = (props) => <i data-lucide="clock" {...props} />;
    const Plus = (props) => <i data-lucide="plus" {...props} />;
    const X = (props) => <i data-lucide="x" {...props} />;
    const CheckCircle = (props) => <i data-lucide="check-circle" {...props} />;

    const AuctionSystem = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [auctions, setAuctions] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedAuction, setSelectedAuction] = useState(null);
      const [bidders, setBidders] = useState([
        { id: 1, name: 'นายสมชาย ใจดี', phone: '081-234-5678', approved: true },
        { id: 2, name: 'นางสาววิภา มั่งมี', phone: '082-345-6789', approved: true }
      ]);
      const [newBidder, setNewBidder] = useState({ name: '', phone: '' });
      const [showAddBidder, setShowAddBidder] = useState(false);
      const [newAuction, setNewAuction] = useState({
        item_name: '',
        description: '',
        assessed_price: '',
        increment: ''
      });
      const [showAddAuction, setShowAddAuction] = useState(false);
      const [bidIncrement, setBidIncrement] = useState(10000);

      // โหลดข้อมูลประมูลจาก D1 ผ่าน API
      useEffect(() => {
        const fetchAuctions = async () => {
          try {
            setLoading(true);
            setError(null);
            const response = await fetch('/api/auctions');
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            // แปลงข้อมูลจาก DB ให้ตรงกับโครงสร้างที่ UI ใช้
            const formattedAuctions = data.map(item => ({
              id: item.id,
              title: item.item_name,
              location: item.description || 'ไม่ระบุสถานที่',
              startPrice: item.assessed_price,
              currentPrice: item.assessed_price, // เริ่มต้นเท่ากับราคาประเมิน (ปรับได้ถ้ามี bids)
              minIncrement: item.increment || 10000,
              status: item.status || 'waiting',
              bidders: [], // ยังใช้ state เดิม
              bids: [],    // ยังใช้ state เดิม (ถ้าต้องการดึงจาก DB จริง ๆ บอกได้)
              endTime: null
            }));
            setAuctions(formattedAuctions);
          } catch (err) {
            console.error("โหลดข้อมูลล้มเหลว:", err);
            setError("ไม่สามารถโหลดรายการประมูลได้ กรุณาตรวจสอบการเชื่อมต่อหรือ backend");
          } finally {
            setLoading(false);
          }
        };
        fetchAuctions();
      }, []);

      // Timer สำหรับนับถอยหลัง (เหมือนเดิม)
      useEffect(() => {
        const timer = setInterval(() => {
          setAuctions(prev => prev.map(auction => {
            if (auction.status === 'active' && auction.endTime) {
              const remaining = auction.endTime - Date.now();
              if (remaining <= 0) {
                return { ...auction, status: 'closed' };
              }
            }
            return auction;
          }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const startAuction = (auctionId) => {
        setAuctions(prev => prev.map(auction =>
          auction.id === auctionId
            ? { ...auction, status: 'active', endTime: Date.now() + 300000 } // 5 นาที
            : auction
        ));
      };

      const placeBid = (auctionId, bidderId, amount) => {
        const bidder = bidders.find(b => b.id === bidderId);
        if (!bidder) return;
        setAuctions(prev => prev.map(auction => {
          if (auction.id === auctionId && amount >= auction.currentPrice + auction.minIncrement) {
            const newBid = {
              bidderId,
              bidderName: bidder.name,
              amount,
              time: new Date().toLocaleTimeString('th-TH')
            };
            return {
              ...auction,
              currentPrice: amount,
              bids: [newBid, ...auction.bids]
            };
          }
          return auction;
        }));
        setSelectedAuction(prev => {
          if (prev && prev.id === auctionId) {
            return {
              ...prev,
              currentPrice: amount,
              bids: [{
                bidderId,
                bidderName: bidder.name,
                amount,
                time: new Date().toLocaleTimeString('th-TH')
              }, ...prev.bids]
            };
          }
          return prev;
        });
      };

      const closeAuction = (auctionId) => {
        setAuctions(prev => prev.map(auction =>
          auction.id === auctionId ? { ...auction, status: 'closed' } : auction
        ));
      };

      const addBidder = () => {
        if (newBidder.name && newBidder.phone) {
          setBidders(prev => [...prev, {
            id: Date.now(),
            ...newBidder,
            approved: true
          }]);
          setNewBidder({ name: '', phone: '' });
          setShowAddBidder(false);
        }
      };

      const addAuction = async () => {
        if (!newAuction.item_name || !newAuction.assessed_price) {
          alert("กรุณากรอกชื่อทรัพย์สินและราคาประเมิน");
          return;
        }

        try {
          const response = await fetch('/api/auctions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              item_name: newAuction.item_name,
              description: newAuction.location || newAuction.description || '',
              assessed_price: parseFloat(newAuction.startPrice || newAuction.assessed_price),
              increment: parseFloat(newAuction.minIncrement || 10000),
              image_path: '' // เพิ่ม logic อัพโหลดภาพทีหลังได้
            }),
          });

          if (!response.ok) {
            const errData = await response.json();
            throw new Error(errData.error || 'เพิ่มรายการไม่สำเร็จ');
          }

          // รีเฟรชข้อมูลหลังเพิ่มสำเร็จ
          const refreshed = await fetch('/api/auctions').then(r => r.json());
          const formatted = refreshed.map(item => ({
            id: item.id,
            title: item.item_name,
            location: item.description || 'ไม่ระบุสถานที่',
            startPrice: item.assessed_price,
            currentPrice: item.assessed_price,
            minIncrement: item.increment || 10000,
            status: item.status || 'waiting',
            bidders: [],
            bids: [],
            endTime: null
          }));
          setAuctions(formatted);

          setShowAddAuction(false);
          setNewAuction({ item_name: '', description: '', assessed_price: '', increment: '' });
        } catch (err) {
          alert("เกิดข้อผิดพลาด: " + err.message);
          console.error(err);
        }
      };

      const getTimeRemaining = (endTime) => {
        if (!endTime) return '--:--';
        const remaining = Math.max(0, endTime - Date.now());
        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
      };

      const formatPrice = (price) => {
        return new Intl.NumberFormat('th-TH').format(price);
      };

      const renderDashboard = () => (
        <div className="space-y-6">
          <div className="flex justify-between items-center">
            <h2 className="text-2xl font-bold text-gray-800">แดชบอร์ดการประมูล</h2>
            <button
              onClick={() => setShowAddAuction(true)}
              className="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors"
            >
              <Plus size={20} />
              เพิ่มรายการประมูล
            </button>
          </div>

          {loading ? (
            <div className="text-center py-10">
              <p className="text-lg text-gray-600">กำลังโหลดข้อมูลจากฐานข้อมูล...</p>
            </div>
          ) : error ? (
            <div className="text-center py-10 text-red-600">
              <p>{error}</p>
              <button 
                onClick={() => window.location.reload()} 
                className="mt-4 bg-red-600 text-white px-4 py-2 rounded"
              >
                ลองโหลดใหม่
              </button>
            </div>
          ) : (
            <>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-blue-50 p-6 rounded-lg border-2 border-blue-200">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-blue-600 text-sm font-medium">รอเริ่มประมูล</p>
                      <p className="text-3xl font-bold text-blue-700">
                        {auctions.filter(a => a.status === 'waiting').length}
                      </p>
                    </div>
                    <Clock size={40} className="text-blue-400" />
                  </div>
                </div>
                {/* การ์ดอื่น ๆ เหมือนเดิม */}
                <div className="bg-green-50 p-6 rounded-lg border-2 border-green-200">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-green-600 text-sm font-medium">กำลังประมูล</p>
                      <p className="text-3xl font-bold text-green-700">
                        {auctions.filter(a => a.status === 'active').length}
                      </p>
                    </div>
                    <Gavel size={40} className="text-green-400" />
                  </div>
                </div>
                <div className="bg-gray-50 p-6 rounded-lg border-2 border-gray-200">
                  <div className="flex items-center justify-between">
                    <div>
                      <p className="text-gray-600 text-sm font-medium">ปิดการประมูล</p>
                      <p className="text-3xl font-bold text-gray-700">
                        {auctions.filter(a => a.status === 'closed').length}
                      </p>
                    </div>
                    <CheckCircle size={40} className="text-gray-400" />
                  </div>
                </div>
              </div>

              <div className="space-y-4">
                {auctions.map(auction => (
                  <div key={auction.id} className="bg-white p-6 rounded-lg border-2 border-gray-200 hover:border-blue-300 transition-colors">
                    <div className="flex justify-between items-start mb-4">
                      <div className="flex-1">
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{auction.title}</h3>
                        <p className="text-gray-600 mb-1">📍 {auction.location}</p>
                        <p className="text-sm text-gray-500">ราคาเริ่มต้น: ฿{formatPrice(auction.startPrice)}</p>
                      </div>
                      <div className="text-right">
                        {auction.status === 'waiting' && (
                          <span className="inline-block bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-sm font-medium">
                            รอเริ่มประมูล
                          </span>
                        )}
                        {auction.status === 'active' && (
                          <span className="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-medium">
                            กำลังประมูล
                          </span>
                        )}
                        {auction.status === 'closed' && (
                          <span className="inline-block bg-gray-100 text-gray-800 px-3 py-1 rounded-full text-sm font-medium">
                            ปิดการประมูล
                          </span>
                        )}
                      </div>
                    </div>
                    {/* ส่วนที่เหลือเหมือนโค้ดเดิมของคุณ */}
                    {/* ... (bg-gradient ราคาปัจจุบัน, ผู้เสนอราคาล่าสุด, ปุ่มต่าง ๆ) ... */}
                  </div>
                ))}
              </div>
            </>
          )}

          {/* Modal เพิ่มรายการประมูล (ปรับให้ใช้ newAuction ที่ตรงกับ DB) */}
          {showAddAuction && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-lg p-6 max-w-md w-full">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-xl font-bold">เพิ่มรายการประมูลใหม่</h3>
                  <button onClick={() => setShowAddAuction(false)}>
                    <X size={24} />
                  </button>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">ชื่อทรัพย์สิน</label>
                    <input
                      type="text"
                      value={newAuction.item_name}
                      onChange={(e) => setNewAuction({...newAuction, item_name: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                      placeholder="เช่น ที่ดินเปล่า เนื้อที่ 50 ตร.ว."
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">คำอธิบาย / สถานที่</label>
                    <input
                      type="text"
                      value={newAuction.description}
                      onChange={(e) => setNewAuction({...newAuction, description: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                      placeholder="เช่น อ.เมือง จ.เชียงใหม่"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">ราคาเริ่มต้น (บาท)</label>
                    <input
                      type="number"
                      value={newAuction.assessed_price}
                      onChange={(e) => setNewAuction({...newAuction, assessed_price: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                      placeholder="500000"
                    />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">ราคาขั้นต่ำที่เพิ่มได้ (บาท)</label>
                    <input
                      type="number"
                      value={newAuction.increment}
                      onChange={(e) => setNewAuction({...newAuction, increment: e.target.value})}
                      className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                      placeholder="10000"
                    />
                  </div>
                  <button
                    onClick={addAuction}
                    className="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium"
                  >
                    เพิ่มรายการ
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );

      // renderBidders และ renderAuctionRoom ใช้โค้ดเดิมของคุณทั้งหมด
      // (คัดลอกส่วนนี้จากโค้ดเดิมของคุณมาใส่ตรงนี้เลยครับ)
      // ถ้าต้องการให้ผมช่วยรวมให้ครบทั้งไฟล์ บอกได้นะครับ

      useEffect(() => {
        if (window.lucide) lucide.createIcons();
      }, []);

      return (
        <div className="min-h-screen bg-gray-100">
          {/* Header */}
          <div className="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 shadow-lg">
            <div className="max-w-7xl mx-auto">
              <div className="flex items-center gap-3 mb-2">
                <Gavel size={32} />
                <h1 className="text-3xl font-bold">ระบบประมูลทอดตลาดทรัพย์สิน</h1>
              </div>
              <p className="text-blue-100">สำหรับเจ้าพนักงานบังคับคดี</p>
            </div>
          </div>

          <div className="max-w-7xl mx-auto p-6">
            {!selectedAuction && (
              <div className="mb-6 flex gap-2">
                <button
                  onClick={() => setActiveTab('dashboard')}
                  className={`px-6 py-3 rounded-lg font-medium transition-colors ${
                    activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'
                  }`}
                >
                  แดชบอร์ด
                </button>
                <button
                  onClick={() => setActiveTab('bidders')}
                  className={`px-6 py-3 rounded-lg font-medium transition-colors ${
                    activeTab === 'bidders' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'
                  }`}
                >
                  ผู้เข้าประมูล
                </button>
              </div>
            )}
            {selectedAuction ? renderAuctionRoom() : activeTab === 'dashboard' ? renderDashboard() : renderBidders()}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AuctionSystem />);
  </script>

  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
