<!DOCTYPE html>

<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบประมูลทอดตลาดทรัพย์สิน</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { Gavel, Users, Clock, Plus, X, CheckCircle } = lucide;

    const AuctionSystem = () => {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [auctions, setAuctions] = useState([
        {
          id: 1,
          title: 'ที่ดินเปล่า เนื้อที่ 50 ตร.ว.',
          location: 'อ.เมือง จ.เชียงใหม่',
          startPrice: 500000,
          currentPrice: 500000,
          minIncrement: 10000,
          status: 'waiting',
          bidders: [],
          bids: [],
          endTime: null
        }
      ]);
      const [selectedAuction, setSelectedAuction] = useState(null);
      const [bidders, setBidders] = useState([
        { id: 1, name: 'นายสมชาย ใจดี', phone: '081-234-5678', approved: true },
        { id: 2, name: 'นางสาววิภา มั่งมี', phone: '082-345-6789', approved: true }
      ]);
      const [newBidder, setNewBidder] = useState({ name: '', phone: '' });
      const [showAddBidder, setShowAddBidder] = useState(false);
      const [newAuction, setNewAuction] = useState({
        title: '',
        location: '',
        startPrice: '',
        minIncrement: ''
      });
      const [showAddAuction, setShowAddAuction] = useState(false);
      const [bidIncrement, setBidIncrement] = useState(10000);

      useEffect(() => {
        const timer = setInterval(() => {
          setAuctions(prev => prev.map(auction => {
            if (auction.status === 'active' && auction.endTime) {
              const remaining = auction.endTime - Date.now();
              if (remaining <= 0) {
                return { ...auction, status: 'closed' };
              }
            }
            return auction;
          }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const startAuction = (auctionId) => {
        setAuctions(prev => prev.map(auction => 
          auction.id === auctionId 
            ? { ...auction, status: 'active', endTime: Date.now() + 300000 }
            : auction
        ));
      };

      const placeBid = (auctionId, bidderId, amount) => {
        const bidder = bidders.find(b => b.id === bidderId);
        if (!bidder) return;
        
        setAuctions(prev => prev.map(auction => {
          if (auction.id === auctionId && amount >= auction.currentPrice + auction.minIncrement) {
            const newBid = {
              bidderId,
              bidderName: bidder.name,
              amount,
              time: new Date().toLocaleTimeString('th-TH')
            };
            return {
              ...auction,
              currentPrice: amount,
              bids: [newBid, ...auction.bids]
            };
          }
          return auction;
        }));

        setSelectedAuction(prev => {
          if (prev && prev.id === auctionId) {
            const updatedAuction = auctions.find(a => a.id === auctionId);
            if (updatedAuction) {
              return {
                ...updatedAuction,
                currentPrice: amount,
                bids: [{
                  bidderId,
                  bidderName: bidder.name,
                  amount,
                  time: new Date().toLocaleTimeString('th-TH')
                }, ...updatedAuction.bids]
              };
            }
          }
          return prev;
        });
      };

      const closeAuction = (auctionId) => {
        setAuctions(prev => prev.map(auction => 
          auction.id === auctionId ? { ...auction, status: 'closed' } : auction
        ));
      };

      const addBidder = () => {
        if (newBidder.name && newBidder.phone) {
          setBidders(prev => [...prev, {
            id: Date.now(),
            ...newBidder,
            approved: true
          }]);
          setNewBidder({ name: '', phone: '' });
          setShowAddBidder(false);
        }
      };

      const addAuction = () => {
        if (newAuction.title && newAuction.startPrice) {
          setAuctions(prev => [...prev, {
            id: Date.now(),
            ...newAuction,
            startPrice: parseInt(newAuction.startPrice),
            minIncrement: parseInt(newAuction.minIncrement) || 10000,
            currentPrice: parseInt(newAuction.startPrice),
            status: 'waiting',
            bidders: [],
            bids: [],
            endTime: null
          }]);
          setNewAuction({ title: '', location: '', startPrice: '', minIncrement: '' });
          setShowAddAuction(false);
        }
      };

      const getTimeRemaining = (endTime) => {
        if (!endTime) return '--:--';
        const remaining = Math.max(0, endTime - Date.now());
        const minutes = Math.floor(remaining / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
      };

      const formatPrice = (price) => {
        return new Intl.NumberFormat('th-TH').format(price);
      };

      const renderDashboard = () => (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 'bold', color: '#1f2937' }}>แดชบอร์ดการประมูล</h2>
            <button
              onClick={() => setShowAddAuction(true)}
              style={{ display: 'flex', alignItems: 'center', gap: '8px', background: '#2563eb', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer' }}
            >
              <Plus size={20} />
              เพิ่มรายการประมูล
            </button>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(250px, 1fr))', gap: '16px' }}>
            <div style={{ background: '#dbeafe', padding: '24px', borderRadius: '8px', border: '2px solid #93c5fd' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div>
                  <p style={{ color: '#2563eb', fontSize: '14px', fontWeight: '500' }}>รอเริ่มประมูล</p>
                  <p style={{ fontSize: '36px', fontWeight: 'bold', color: '#1e40af' }}>
                    {auctions.filter(a => a.status === 'waiting').length}
                  </p>
                </div>
                <Clock size={40} color="#93c5fd" />
              </div>
            </div>

            <div style={{ background: '#dcfce7', padding: '24px', borderRadius: '8px', border: '2px solid #86efac' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div>
                  <p style={{ color: '#16a34a', fontSize: '14px', fontWeight: '500' }}>กำลังประมูล</p>
                  <p style={{ fontSize: '36px', fontWeight: 'bold', color: '#15803d' }}>
                    {auctions.filter(a => a.status === 'active').length}
                  </p>
                </div>
                <Gavel size={40} color="#86efac" />
              </div>
            </div>

            <div style={{ background: '#f3f4f6', padding: '24px', borderRadius: '8px', border: '2px solid #d1d5db' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <div>
                  <p style={{ color: '#4b5563', fontSize: '14px', fontWeight: '500' }}>ปิดการประมูล</p>
                  <p style={{ fontSize: '36px', fontWeight: 'bold', color: '#374151' }}>
                    {auctions.filter(a => a.status === 'closed').length}
                  </p>
                </div>
                <CheckCircle size={40} color="#d1d5db" />
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            {auctions.map(auction => (
              <div key={auction.id} style={{ background: 'white', padding: '24px', borderRadius: '8px', border: '2px solid #e5e7eb' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'start', marginBottom: '16px' }}>
                  <div style={{ flex: 1 }}>
                    <h3 style={{ fontSize: '20px', fontWeight: 'bold', color: '#1f2937', marginBottom: '8px' }}>{auction.title}</h3>
                    <p style={{ color: '#4b5563', marginBottom: '4px' }}>📍 {auction.location}</p>
                    <p style={{ fontSize: '14px', color: '#6b7280' }}>ราคาเริ่มต้น: ฿{formatPrice(auction.startPrice)}</p>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    {auction.status === 'waiting' && (
                      <span style={{ display: 'inline-block', background: '#fef3c7', color: '#92400e', padding: '4px 12px', borderRadius: '9999px', fontSize: '14px', fontWeight: '500' }}>
                        รอเริ่มประมูล
                      </span>
                    )}
                    {auction.status === 'active' && (
                      <span style={{ display: 'inline-block', background: '#d1fae5', color: '#065f46', padding: '4px 12px', borderRadius: '9999px', fontSize: '14px', fontWeight: '500' }}>
                        กำลังประมูล
                      </span>
                    )}
                    {auction.status === 'closed' && (
                      <span style={{ display: 'inline-block', background: '#f3f4f6', color: '#1f2937', padding: '4px 12px', borderRadius: '9999px', fontSize: '14px', fontWeight: '500' }}>
                        ปิดการประมูล
                      </span>
                    )}
                  </div>
                </div>

                <div style={{ background: 'linear-gradient(to right, #dbeafe, #f3e8ff)', padding: '16px', borderRadius: '8px', marginBottom: '16px' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div>
                      <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '4px' }}>ราคาปัจจุบัน</p>
                      <p style={{ fontSize: '36px', fontWeight: 'bold', color: '#2563eb' }}>฿{formatPrice(auction.currentPrice)}</p>
                    </div>
                    {auction.status === 'active' && (
                      <div style={{ textAlign: 'right' }}>
                        <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '4px' }}>เวลาที่เหลือ</p>
                        <p style={{ fontSize: '24px', fontWeight: 'bold', color: '#dc2626' }}>{getTimeRemaining(auction.endTime)}</p>
                      </div>
                    )}
                  </div>
                </div>

                {auction.bids.length > 0 && (
                  <div style={{ marginBottom: '16px' }}>
                    <p style={{ fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '8px' }}>ผู้เสนอราคาล่าสุด:</p>
                    <p style={{ fontSize: '18px', fontWeight: '600', color: '#16a34a' }}>{auction.bids[0].bidderName}</p>
                  </div>
                )}

                <div style={{ display: 'flex', gap: '8px' }}>
                  {auction.status === 'waiting' && (
                    <button
                      onClick={() => startAuction(auction.id)}
                      style={{ flex: 1, background: '#16a34a', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: '500' }}
                    >
                      เริ่มประมูล
                    </button>
                  )}
                  {auction.status === 'active' && (
                    <>
                      <button
                        onClick={() => {
                          const selected = auctions.find(a => a.id === auction.id);
                          setSelectedAuction(selected);
                          setBidIncrement(selected.minIncrement);
                        }}
                        style={{ flex: 1, background: '#2563eb', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: '500' }}
                      >
                        เข้าสู่ห้องประมูล
                      </button>
                      <button
                        onClick={() => closeAuction(auction.id)}
                        style={{ background: '#dc2626', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: '500' }}
                      >
                        ปิดการประมูล
                      </button>
                    </>
                  )}
                  {auction.status === 'closed' && (
                    <button
                      onClick={() => setSelectedAuction(auction)}
                      style={{ flex: 1, background: '#6b7280', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: '500' }}
                    >
                      ดูรายละเอียด
                    </button>
                  )}
                </div>
              </div>
            ))}
          </div>

          {showAddAuction && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px', zIndex: 50 }}>
              <div style={{ background: 'white', borderRadius: '8px', padding: '24px', maxWidth: '28rem', width: '100%' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '20px', fontWeight: 'bold' }}>เพิ่มรายการประมูลใหม่</h3>
                  <button onClick={() => setShowAddAuction(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280' }}>
                    <X size={24} />
                  </button>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '4px' }}>ชื่อทรัพย์สิน</label>
                    <input
                      type="text"
                      value={newAuction.title}
                      onChange={(e) => setNewAuction({...newAuction, title: e.target.value})}
                      style={{ width: '100%', padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      placeholder="เช่น ที่ดินเปล่า เนื้อที่ 50 ตร.ว."
                    />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '4px' }}>สถานที่</label>
                    <input
                      type="text"
                      value={newAuction.location}
                      onChange={(e) => setNewAuction({...newAuction, location: e.target.value})}
                      style={{ width: '100%', padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      placeholder="เช่น อ.เมือง จ.เชียงใหม่"
                    />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '4px' }}>ราคาเริ่มต้น (บาท)</label>
                    <input
                      type="number"
                      value={newAuction.startPrice}
                      onChange={(e) => setNewAuction({...newAuction, startPrice: e.target.value})}
                      style={{ width: '100%', padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      placeholder="500000"
                    />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '4px' }}>ราคาขั้นต่ำที่เพิ่มได้ (บาท)</label>
                    <input
                      type="number"
                      value={newAuction.minIncrement}
                      onChange={(e) => setNewAuction({...newAuction, minIncrement: e.target.value})}
                      style={{ width: '100%', padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      placeholder="10000"
                    />
                  </div>
                  <button
                    onClick={addAuction}
                    style={{ width: '100%', background: '#2563eb', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: '500' }}
                  >
                    เพิ่มรายการ
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );

      const renderBidders = () => (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <h2 style={{ fontSize: '24px', fontWeight: 'bold', color: '#1f2937' }}>จัดการผู้เข้าประมูล</h2>
            <button
              onClick={() => setShowAddBidder(true)}
              style={{ display: 'flex', alignItems: 'center', gap: '8px', background: '#2563eb', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer' }}
            >
              <Plus size={20} />
              เพิ่มผู้เข้าประมูล
            </button>
          </div>

          <div style={{ background: '#dbeafe', padding: '16px', borderRadius: '8px', border: '1px solid #93c5fd' }}>
            <p style={{ color: '#1e40af' }}>
              <strong>จำนวนผู้ลงทะเบียน:</strong> {bidders.length} คน
            </p>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '16px' }}>
            {bidders.map(bidder => (
              <div key={bidder.id} style={{ background: 'white', padding: '16px', borderRadius: '8px', border: '2px solid #e5e7eb' }}>
                <div style={{ display: 'flex', alignItems: 'start', justifyContent: 'space-between' }}>
                  <div style={{ flex: 1 }}>
                    <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: '#1f2937', marginBottom: '4px' }}>{bidder.name}</h3>
                    <p style={{ color: '#4b5563', fontSize: '14px', marginBottom: '8px' }}>📱 {bidder.phone}</p>
                    {bidder.approved && (
                      <span style={{ display: 'inline-block', background: '#d1fae5', color: '#065f46', padding: '4px 8px', borderRadius: '4px', fontSize: '12px', fontWeight: '500' }}>
                        ✓ อนุมัติแล้ว
                      </span>
                    )}
                  </div>
                  <Users size={24} color="#93c5fd" />
                </div>
              </div>
            ))}
          </div>

          {showAddBidder && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '16px', zIndex: 50 }}>
              <div style={{ background: 'white', borderRadius: '8px', padding: '24px', maxWidth: '28rem', width: '100%' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                  <h3 style={{ fontSize: '20px', fontWeight: 'bold' }}>เพิ่มผู้เข้าประมูล</h3>
                  <button onClick={() => setShowAddBidder(false)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#6b7280' }}>
                    <X size={24} />
                  </button>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '4px' }}>ชื่อ-นามสกุล</label>
                    <input
                      type="text"
                      value={newBidder.name}
                      onChange={(e) => setNewBidder({...newBidder, name: e.target.value})}
                      style={{ width: '100%', padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      placeholder="นายสมชาย ใจดี"
                    />
                  </div>
                  <div>
                    <label style={{ display: 'block', fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '4px' }}>เบอร์โทรศัพท์</label>
                    <input
                      type="tel"
                      value={newBidder.phone}
                      onChange={(e) => setNewBidder({...newBidder, phone: e.target.value})}
                      style={{ width: '100%', padding: '8px 12px', border: '1px solid #d1d5db', borderRadius: '8px' }}
                      placeholder="081-234-5678"
                    />
                  </div>
                  <button
                    onClick={addBidder}
                    style={{ width: '100%', background: '#2563eb', color: 'white', padding: '8px 16px', borderRadius: '8px', border: 'none', cursor: 'pointer', fontWeight: '500' }}
                  >
                    เพิ่มผู้เข้าประมูล
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );

      const renderAuctionRoom = () => {
        if (!selectedAuction) return null;

        const handleBidClick = (bidderId) => {
          const newPrice = selectedAuction.currentPrice + bidIncrement;
          placeBid(selectedAuction.id, bidderId, newPrice);
        };

        return (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '24px' }}>
            <button
              onClick={() => setSelectedAuction(null)}
              style={{ background: 'none', border: 'none', color: '#2563eb', fontSize: '16px', fontWeight: '500', cursor: 'pointer', textAlign: 'left' }}
            >
              ← กลับไปแดชบอร์ด
            </button>

            <div style={{ background: 'white', padding: '24px', borderRadius: '8px', border: '2px solid #93c5fd' }}>
              <h2 style={{ fontSize: '24px', fontWeight: 'bold', color: '#1f2937', marginBottom: '8px' }}>{selectedAuction.title}</h2>
              <p style={{ color: '#4b5563', marginBottom: '16px' }}>📍 {selectedAuction.location}</p>

              <div style={{ background: 'linear-gradient(to right, #d1fae5, #dbeafe)', padding: '24px', borderRadius: '8px', marginBottom: '24px' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                  <div>
                    <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '4px' }}>ราคาปัจจุบัน</p>
                    <p style={{ fontSize: '40px', fontWeight: 'bold', color: '#16a34a' }}>฿{formatPrice(selectedAuction.currentPrice)}</p>
                  </div>
                  {selectedAuction.status === 'active' && (
                    <div style={{ textAlign: 'right' }}>
                      <p style={{ fontSize: '14px', color: '#4b5563', marginBottom: '4px' }}>เวลาที่เหลือ</p>
                      <p style={{ fontSize: '40px', fontWeight: 'bold', color: '#dc2626' }}>{getTimeRemaining(selectedAuction.endTime)}</p>
                    </div>
                  )}
                </div>
              </div>

              {selectedAuction.status === 'active' && (
                <div style={{ marginBottom: '24px', display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <h3 style={{ fontSize: '18px', fontWeight: 'bold', color: '#1f2937' }}>รับการเสนอราคา</h3>
                  
                  <div>
                    <p style={{ fontSize: '14px', fontWeight: '500', color: '#374151', marginBottom: '8px' }}>เลือกจำนวนเงินที่เพิ่ม:</p>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(100px, 1fr))', gap: '8px' }}>
                      {[10000, 20000, 50000, 100000, 200000, 500000].map(amount => (
                        <button
